<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service health</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2312110e'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%23c6a36a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="top">
    <div>
      <p class="kicker">ITIL 5</p>
      <h1>Service health</h1>
      <p class="lede">Availability, latency, events, and incidents against agreed service levels.</p>
    </div>
    <div class="top-side">
      <nav class="nav" aria-label="Pages">
        <a href="/" aria-current="page">Board</a>
        <a href="/manage">Manage</a>
      </nav>
      <div class="live" id="live">
        <span class="dot" aria-hidden="true"></span>
        <span id="live-label">Connecting</span>
        <span class="live-meta" id="swept">Waiting for the first sweep</span>
      </div>
    </div>
  </header>
  <section class="summary" id="summary" aria-label="Summary"></section>
  <main class="layout">
    <section class="panel">
      <header class="panel-h">
        <h2>Catalogue</h2>
        <p id="catalogue-sub">Configuration items</p>
      </header>
      <div id="services"></div>
    </section>
    <aside class="side">
      <section class="panel">
        <header class="panel-h">
          <h2>Incidents</h2>
          <p id="incident-sub">Interruptions only</p>
        </header>
        <div id="incidents"></div>
      </section>
      <section class="panel">
        <header class="panel-h">
          <h2>Events</h2>
          <p>Not every event is an incident</p>
        </header>
        <div class="scroll" id="events"></div>
      </section>
    </aside>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
